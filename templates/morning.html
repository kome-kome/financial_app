<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朝の推奨（読むだけ）</title>
<script src="/static/js/theme-init.js"></script>
<style>
:root{
  --bg:#0f1117;--bg-elevated:#1a1d2e;--bg-sunken:#0f1117;--bg-hover:#1e293b;
  --border:#2d3154;--border-muted:#334155;--border-subtle:#1e2235;
  --text:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;--text-body:#cbd5e1;
  --accent:#7c3aed;--accent-hover:#6d28d9;--accent-text:#a78bfa;
  --accent-soft-bg:#312e81;--accent-soft-text:#c4b5fd;--accent-deep-bg:#2e1065;
  --status-good:#10b981;--status-good-bg:#052e16;--status-good-text:#86efac;
  --status-bad:#ef4444;--status-bad-bg:#450a0a;--status-bad-text:#fca5a5;
  --status-warn:#f59e0b;--status-warn-bg:#451a03;--status-warn-text:#fcd34d;
  --status-info:#60a5fa;--status-info-bg:#1e3a5f;--status-info-text:#93c5fd;
  --val-up:#3b82f6;--val-up-bg:#1e3a5f;--val-up-text:#93c5fd;
  --val-down:#ef4444;--val-down-bg:#450a0a;--val-down-text:#fca5a5;
  --val-neutral:#10b981;--val-neutral-bg:#052e16;--val-neutral-text:#86efac;
  --shadow-color:rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#f8fafc;--bg-elevated:#ffffff;--bg-sunken:#f1f5f9;--bg-hover:#e2e8f0;
  --border:#e2e8f0;--border-muted:#cbd5e1;--border-subtle:#e5e7eb;
  --text:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;--text-body:#334155;
  --accent:#7c3aed;--accent-hover:#6d28d9;--accent-text:#6d28d9;
  --accent-soft-bg:#ede9fe;--accent-soft-text:#6d28d9;--accent-deep-bg:#ddd6fe;
  --status-good:#059669;--status-good-bg:#d1fae5;--status-good-text:#065f46;
  --status-bad:#dc2626;--status-bad-bg:#fee2e2;--status-bad-text:#991b1b;
  --status-warn:#d97706;--status-warn-bg:#fef3c7;--status-warn-text:#92400e;
  --status-info:#2563eb;--status-info-bg:#dbeafe;--status-info-text:#1e40af;
  --val-up:#2563eb;--val-up-bg:#dbeafe;--val-up-text:#1e40af;
  --val-down:#dc2626;--val-down-bg:#fee2e2;--val-down-text:#991b1b;
  --val-neutral:#059669;--val-neutral-bg:#d1fae5;--val-neutral-text:#065f46;
  --shadow-color:rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--bg-elevated);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px}
.header h1{font-size:17px;font-weight:600;color:var(--accent-text)}
.badge{background:var(--accent-soft-bg);color:var(--accent-soft-text);font-size:11px;padding:3px 8px;border-radius:12px}
.theme-toggle-btn{background:transparent;border:1px solid var(--border-muted);color:var(--text);border-radius:6px;width:30px;height:30px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.theme-toggle-btn:hover{background:var(--bg-hover)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-green{background:var(--status-good)}.dot-amber{background:var(--status-warn)}.dot-red{background:var(--status-bad)}
.api-status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.container{padding:28px 24px;max-width:1100px;margin:0 auto}
.section-title{font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
@media (max-width: 768px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .nav-grid{grid-template-columns:1fr}
  .sched-grid{grid-template-columns:1fr 1fr}
}
@media (max-width: 480px){
  .stats-grid{grid-template-columns:1fr}
  .sched-grid{grid-template-columns:1fr}
}
.stat-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:18px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:128px}
.stat-card.warn{border-color:var(--status-warn)}
.stat-card.alert{border-color:var(--status-bad)}
.stat-label{font-size:11px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:26px;font-weight:700;line-height:1.1}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.stat-meta{font-size:10px;color:var(--text-muted);margin-top:6px;line-height:1.45}
.freshness-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-top:6px}
.fr-fresh{background:var(--status-good-bg);color:var(--status-good-text)}
.fr-ok{background:var(--status-info-bg);color:var(--status-info-text)}
.fr-stale{background:var(--status-warn-bg);color:var(--status-warn-text)}
.fr-outdated{background:var(--status-bad-bg);color:var(--status-bad-text)}
.fr-empty{background:var(--bg-hover);color:var(--text-muted)}
.update-banner{background:var(--accent-soft-bg);border:1px solid var(--accent);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:none;align-items:center;gap:14px;font-size:13px;color:var(--accent-soft-text)}
.update-banner.show{display:flex}
.update-banner a{color:var(--accent-text);font-weight:600;text-decoration:none;border:1px solid var(--accent);padding:5px 12px;border-radius:6px;font-size:12px;margin-left:auto;flex-shrink:0}
.update-banner a:hover{background:var(--accent);color:#fff}
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.nav-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s}
.nav-card:hover{border-color:var(--accent)}
.nav-card-title{font-size:16px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:10px}
.nav-card-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.icon-blue{background:var(--status-info-bg)}
.icon-purple{background:var(--accent-deep-bg)}
.nav-card-desc{font-size:12px;color:var(--text-muted);line-height:1.7}
.feature-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.feature-list li{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.feature-list li::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent);flex-shrink:0}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;background:var(--accent);color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:500;margin-top:auto;transition:background .15s;border:none;cursor:pointer;width:fit-content}
.nav-btn:hover{background:var(--accent-hover)}
.nav-btn-outline{background:transparent;border:1px solid var(--border-muted);color:var(--text-secondary)}
.nav-btn-outline:hover{background:var(--bg-hover);color:var(--text)}
.nav-grid-main{grid-template-columns:1fr 1fr}
.nav-grid-sub{grid-template-columns:1fr}
.aux-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.aux-card{background:var(--bg-sunken);border:1px solid var(--border-subtle);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-decoration:none;transition:border-color .2s}
.aux-card:hover{border-color:var(--border-muted)}
.aux-card-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.aux-card-title{font-size:13px;font-weight:600;color:var(--text-body)}
.aux-card-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
@media(max-width:720px){.aux-grid{grid-template-columns:1fr}}
.scheduler-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:20px}
.sched-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
.sched-item{background:var(--bg-sunken);border-radius:8px;padding:14px}
.sched-item-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sched-item-value{font-size:14px;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tag-green{background:var(--status-good-bg);color:var(--status-good-text)}
.tag-amber{background:var(--status-warn-bg);color:var(--status-warn-text)}
.tag-blue{background:var(--status-info-bg);color:var(--status-info-text)}
.tag-gray{background:var(--bg-hover);color:var(--text-muted)}
.spinner{width:14px;height:14px;border:2px solid var(--border-muted);border-top-color:var(--accent-text);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 朝ダッシュボード固有（Issue #423 子3）─────────────────────────────── */
.verdict{border-radius:12px;padding:18px 20px;margin-bottom:24px;border:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.verdict-fresh{background:var(--status-good-bg);border-color:var(--status-good)}
.verdict-warn{background:var(--status-warn-bg);border-color:var(--status-warn)}
.verdict-alert{background:var(--status-bad-bg);border-color:var(--status-bad)}
.verdict-head{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}
.verdict-fresh .verdict-head{color:var(--status-good-text)}
.verdict-warn .verdict-head{color:var(--status-warn-text)}
.verdict-alert .verdict-head{color:var(--status-bad-text)}
.verdict-reasons{list-style:none;display:flex;flex-direction:column;gap:5px}
.verdict-reasons li{font-size:12px;color:var(--text-body);display:flex;gap:7px;align-items:flex-start}
.verdict-reasons li::before{content:'•';color:var(--text-muted);flex-shrink:0}
.verdict a{color:var(--accent-text);font-size:12px;text-decoration:none;width:fit-content}
.verdict a:hover{text-decoration:underline}
.fresh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px}
@media(max-width:768px){.fresh-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.fresh-grid{grid-template-columns:1fr}}
.fresh-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:5px}
.fresh-card.warn{border-color:var(--status-warn)}
.fresh-card.alert{border-color:var(--status-bad)}
.fresh-card-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.fresh-card-value{font-size:19px;font-weight:700}
.fresh-card-sub{font-size:11px;color:var(--text-muted);line-height:1.6}
.fresh-card a{font-size:11px;color:var(--accent-text);text-decoration:none;margin-top:auto}
.rank-table{width:100%;border-collapse:collapse;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:12px}
.rank-table th{background:var(--bg-sunken);color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;text-align:left;white-space:nowrap}
.rank-table td{padding:9px 12px;border-top:1px solid var(--border-subtle);color:var(--text-body);white-space:nowrap}
.rank-table tbody tr:hover{background:var(--bg-hover)}
.rank-num{color:var(--text-muted);font-variant-numeric:tabular-nums}
.rank-name{color:var(--text);font-weight:500}
.rank-score{font-weight:700;color:var(--accent-text);font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
.stale-asof{color:var(--status-warn-text)}
.controls{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.controls select{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border-muted);border-radius:6px;padding:7px 10px;font-size:12px}
.muted{font-size:11px;color:var(--text-muted)}
</style>
</head>
<body>

<div class="header">
  <div style="width:32px;height:32px;background:var(--accent-soft-bg);border-radius:8px;display:flex;align-items:center;justify-content:center">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-text)" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </div>
  <h1>朝の推奨</h1>
  <span class="badge">読むだけ・再計算なし</span>
  <div class="api-status">
    <span class="dot dot-amber" id="api-dot"></span>
    <span id="api-label">読み込み中...</span>
  </div>
  <button id="theme-toggle" class="theme-toggle-btn" title="ライト/ダーク切替" aria-label="テーマ切替">🌙</button>
</div>

<div class="container">

  <!-- 発注してよいかの総合判定（Issue #423 子3・鮮度は必須表示） -->
  <div class="verdict verdict-warn" id="verdict">
    <div class="verdict-head" id="verdict-head"><span class="spinner"></span> 鮮度を確認しています…</div>
    <ul class="verdict-reasons" id="verdict-reasons"></ul>
    <a id="verdict-link" href="#" target="_blank" rel="noopener">復旧手順（DEPLOYMENT.md）を見る →</a>
  </div>

  <div class="section-title">データ鮮度</div>
  <div class="fresh-grid" id="fresh-grid"></div>

  <div class="section-title">買い推奨ランキング</div>
  <div class="controls">
    <label class="muted" for="mor-preset">プリセット</label>
    <select id="mor-preset" data-change="reload">
      <option>バランス型</option>
      <option>成長重視</option>
      <option>割安重視</option>
      <option>高収益重視</option>
      <option>統計的最適化</option>
    </select>
    <label class="muted" for="mor-topn">表示件数</label>
    <select id="mor-topn" data-change="reload">
      <option value="20" selected>20</option>
      <option value="30">30</option>
      <option value="50">50</option>
    </select>
    <span class="muted" id="mor-generated"></span>
  </div>
  <div style="overflow-x:auto">
    <table class="rank-table">
      <thead>
        <tr>
          <th>#</th><th>コード</th><th>企業名</th><th>業種</th>
          <th class="num">スコア</th><th class="num">PER</th><th class="num">PBR</th>
          <th class="num">ROE</th><th class="num">乖離率</th><th>株価 as-of</th>
        </tr>
      </thead>
      <tbody id="rank-body">
        <tr><td colspan="10" class="muted" style="padding:18px">読み込み中…</td></tr>
      </tbody>
    </table>
  </div>
  <p class="muted" style="margin-top:12px">
    このページは学習・再計算をしません。夜間バッチ（差分収集 → 夜間スコア更新）が書き込んだ結果を読み出して表示します。
  </p>

</div>

<script src="/static/js/common.js"></script>
<script src="/static/js/morning.js"></script>
</body>
</html>
