name: "[CI] pytest 自動テスト"

# PR と main への push で pytest を自動実行する回帰検知用 CI。
# 収集パイプライン（full / incremental / backfill / refill-cf）とは独立し、
# Secrets・外部ネットワーク・本番 DB に一切依存しない（conftest.py の
# in-memory SQLite / モックで完結する範囲のみ）。

on:
  pull_request:
  push:
    branches:
      - main

# 同一 PR/ブランチで新しい push があれば古い実行をキャンセルする。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # ハングを止めるための歯止め（#703）。ランナー割当から `Set up job` 開始までの空白も
    # この時間に入る（通常 0〜1秒・実測最大 114秒＝2026-09-19 に #702 がこれで取り消された）。
    # 当時は pytest の 86〜90% を test_collect_macro の実待機 626秒が占め、job 本体が
    # 最大 801秒＝余裕 99秒しかなかった。上げて逃がさず原因を直し、15分のまま据え置く。
    # 1本の遅いテストは tests/conftest.py の上限（60秒）が失敗にする。
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'  # render.yaml の PYTHON_VERSION と一致させる
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # --durations: 遅い順の上位を毎回ログへ出す（伸びた箇所を行タイムスタンプから
      # 再構成しなくて済むように・#703）。
      - name: Run pytest
        run: pytest --durations=20
