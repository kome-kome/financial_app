name: "[定常] 差分収集・毎日自動実行"

# JST 17:17 = UTC 08:17
# 差分収集（過去1年・skip_existing）＋成長率/Zスコア＋市場データ＋マクロデータ
# Render 側には自動収集を持たせない設計。定時自動収集はこのワークフローが担う。
#
# ⏰ 起動時刻の根拠（#476・2026-08-09 に JST 03:00 から移動）
#   15:30  東証 大引け（2024-11-05 のクロージング・オークション導入で 15:00 から延伸）
#   17:15  EDINET 提出受付終了 → その日の書類一覧が確定
#   17:17  ← ここで起動。JST 22:30（夏）/ 23:30（冬）の NYSE オープンまでに
#          マクロ収集（Phase 3・実測3〜5分）が終わる時間帯でもある
#   05:00（夏）/ 06:00（冬）  米国市場クローズ
# **市場データの中身は JST 03:00 起動と完全に同じ**（前者は当日大引け後、後者は翌03:00
# だが、その時点で米国は場中＝直近の確定クローズは同一セッション）。変わるのは
# ①ユーザーが結果を見られる時刻が約9時間早い ②EDINET が当日提出ぶんを拾える の2点。
# 東証も NYSE も閉じている唯一の窓（JST 16:00〜22:30）に置いてあるので、#474 で問題に
# した「進行中セッションの途中経過バー」を平時は踏まない。**ただし GHA の cron 遅延は
# 実測で最大6時間**（18:00Z が 00:08Z 起動）なので、保証はコード側（in-progress バー
# 除外・`last_closed_session`）が持つ。スケジュールは第一防御でしかない。
# 分を :00 からずらしてあるのは毎時ピークの遅延を避けるため。

on:
  # ✅ schedule は有効（2026-06-22〜）。Yahoo ギャップ補完が GitHub Actions（Azure IP）
  # から動作することを workflow_dispatch で実証済み。J-Quants 無料は直近12週を配信
  # しないため、株価鮮度の担い手は Phase 4 の Yahoo ギャップ補完
  # （fill_recent_stock_price_gap_yahoo）である＝ここが失敗すると鮮度が止まる。
  # 実測所要 2h05m〜2h38m（2026-08-02 の success run 2本・#422）。#474 以降、
  # 週末・祝日明けは gap-fill をほぼ丸ごと飛ばすため大きく短くなる。
  # このワークフローの success が nightly-scores / macro-health の workflow_run
  # チェーンを起動する（#432 / #420）ので、name を変えるときは両 yml の if も直す。
  # nightly-scores は実測33〜35分なので、チェーン終端は JST 21〜22時台の見込み。
  # ⛔ 2026-08-10: schedule を一時停止中（#477）。Supabase インスタンスが飽和しており、
  #    count(*) companies=25.9秒 / count(*) macro_data=78.5秒（RTT は 14.5ms で正常）＝
  #    CPU/Disk IO のバーストクレジット枯渇が疑われる。この状態で 2〜3時間の全社収集を
  #    走らせると回復をさらに遅らせるため止めた。休場明けの取りこぼしは #474 の
  #    last_closed_session 基準で翌日以降の run が 183日窓で拾う。
  #    **復旧条件**: 上記レイテンシが常識的な水準（count(*) companies が 1秒未満）へ戻ったら
  #    下の schedule を戻す。手動確認は workflow_dispatch で先に1回。
  # schedule:
  #   - cron: '17 8 * * *'   # UTC 08:17 = JST 17:17
  workflow_dispatch:

# 最小権限（GITHUB_TOKEN でリポジトリ書込は不要・収集/保守は Supabase 直結）
permissions:
  contents: read

jobs:
  incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 初回 Yahoo backfill（~12週分）のため一時的に延長。定常時は120分で十分。

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'  # render.yaml の PYTHON_VERSION と一致させる
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run incremental pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python _pipeline_incremental.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: incremental-log
          path: logs/pipeline_incremental.log
          retention-days: 7
