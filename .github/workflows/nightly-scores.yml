name: "[定常] 夜間スコア更新（sector_ols + M-6）"

# 目的（Issue #432/#443・親 #423）:
#   朝は「読むだけ」にするため、夜のうちに producer を回して結果を永続化する。
#   - sector_ols → regression_results（gap_ratio）。#432 時点で自動経路が1本も無く、
#     実測で computed_at が 33〜36 日前だった。gap_ratio はバランス型プリセットの
#     既定重みに入っており、ユーザーが毎朝必ず踏むパス。
#   - macro_enet（M-6）→ macro_enet_scores（μ̂）。sell_ranking の**既定** mu_source
#     （#402・ADR-0022）なのに、M-6 は tune-hyperparameters.yml の matrix に入って
#     おらず、--persist-scores の副作用でも更新されない＝ローカル手動実行が唯一の
#     更新経路だった（#443）。
#
# 設計上の注意（触る前に必ず読むこと）:
#   - 起動は daily-incremental の workflow_run チェーン。**success のときだけ**回す。
#     株価が前進していない日にスコアだけ更新すると、古い株価由来の値が「今日の
#     ランキング」として出てしまう（#423 の依存関係にある通り、鮮度が先）。
#   - `workflows:` は列挙せず `["**"]`（全マッチ1本）に固定する。GitHub は各要素を
#     フィルタパターンとして解釈するため、"[定常] …" と角括弧で始まる名前を列挙すると
#     startup_failure になる（2026-08-02 実測・notify-failure.yml のコメント参照）。
#     対象の絞り込みは job の if の名前一致で行う。
#   - workflow_run は **default branch (main) 上のファイルだけ**が実行される。
#     feature ブランチでチェーンの実火は検証できない＝main 反映後に確認する。
#   - `tee` を使うステップは `set -o pipefail` を必ず置く。パイプすると exit code が
#     tee 側で上書きされ、失敗が success に化ける（Issue #352 の実例）。

on:
  workflow_run:
    workflows: ["**"]
    types: [completed]
  workflow_dispatch:

# 最小権限（永続化は Supabase 直結・リポジトリ書込は不要）
permissions:
  contents: read

jobs:
  scores:
    # 手動 dispatch か、daily-incremental が success で終わったときだけ実行する。
    # 名前一致なので daily-incremental.yml の name を変えたらここも直す
    # ＝tests/test_nightly_scores.py が整合を強制する。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == '[定常] 差分収集・毎日自動実行' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # 実測で締めた値（Issue #446）。M-6 込みの本番実走2本:
    #   run 30954182465（2026-08-04）sector_ols 30.3分 + macro_enet 3.2分 = 総 33.5分（job 34.5分）
    #   run 31050406971（2026-08-05）sector_ols 29.4分 + macro_enet 3.2分 = 総 32.6分（job 33.5分）
    # 重いのは sector_ols（M-6 は 3.2分）。起票時の根拠だった 16.1分（2026-08-03・run
    # 30808053564）は #434 の構造的NULL対応前の値で、いまは約2倍になっている＝**所要は
    # 銘柄数・業種数とともに伸びるので、締めた後も実走ログで追うこと**。
    # 70 = 実測 job wall 最大 34.5分 × 2.0。timeout の cancelled は notify-failure が拾う
    # （#414・#453）ため、締めすぎると平常運転が誤起票になる。
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'  # render.yaml の PYTHON_VERSION と一致させる
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 週次株価の run 間キャッシュ（#480・ADR-0036）。これが無いと毎晩 1,282,436 行
      # （39.3MB）を引き直す＝月 1.98GB で無料枠 5GB の 40%。
      #   - key を run_id でユニークにして**必ず save させる**。固定キーだと初日以降 save が
      #     起きず、基準が古いまま凍って 27週窓では届かなくなり毎晩フルロードへ退化する。
      #   - 復元は restore-keys の前方一致で直近世代を拾う（ローリング更新）。
      #   - **キャッシュが無い/壊れている/古いは、すべて安全側（フルロード）へ倒れる**。
      #     正しさが依存しているのは指紋と世代印だけで、ここは速さだけを担う。
      - name: Restore weekly price cache
        uses: actions/cache/restore@v4
        with:
          path: .weekly_cache
          key: weekly-prices-v1-${{ github.run_id }}
          restore-keys: |
            weekly-prices-v1-

      - name: Run nightly scores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINAPP_JOB: nightly-scores          # Egress 台帳の帰属ラベル（#478）
        run: |
          set -o pipefail
          python nightly_scores.py 2>&1 | tee nightly_scores.log

      # save を暗黙の post ステップに任せず明示する（job 失敗時の挙動が仕様として保証されて
      # いないため）。1モデルが落ちても週次キャッシュは保存する＝nightly_scores が例外を
      # 握って続行する設計と揃える。
      - name: Save weekly price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .weekly_cache
          key: weekly-prices-v1-${{ github.run_id }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-scores-log
          path: |
            nightly_scores.log
            .egress/*.jsonl
          retention-days: 30
