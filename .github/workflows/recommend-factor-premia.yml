name: "[補完] recommend Fama-MacBeth ファクタープレミアム推定バッチ"

# recommend_factor_premia.py（Issue #271／ADR-0008）の断面回帰バッチを GitHub Actions で
# 実行し、Fama & MacBeth (1973) の月次断面 OLS で推定したファクタープレミアムを
# recommend_factor_premia テーブルへ永続化するワークフロー（Issue #342）。
# recommend プラグイン（plugins.recommend.resolve_weights()）が producer としてこれを読み、
# 「統計的最適化」プリセット重みとして利用する。
#
# 背景（Issue #342 / #339）: macro_beta_inference.py（M-1 producer）と同じ producer/consumer
# 分離設計（バッチ→専用テーブル→プラグインが読む）でありながら、recommend_factor_premia.py
# だけは GitHub Actions ワークフローが存在せず、実行手段がローカル CLI 手動実行のみだった。
# ローカル専用 CLI でも接続先は本番 Supabase（feedback_local_scripts_hit_production_db）で、
# 実行有無・頻度が git 履歴にもワークフロー実行ログにも残らず鮮度の実態が不明だったため、
# 「Actions 経由で実行した記録が残る」状態にする。
#
# 実行頻度: **月次 cron（毎月5日 UTC 22:00 = JST 翌07:00）＋手動**（Issue #423 子5）。
# Fama-MacBeth の設計自体が月末スナップショット・52週先リターンの月次 cadence（#271）なので、
# 推定に効く新情報は「月末が1つ増える」ことだけ＝月次で過不足ない。
#
# cron 化の根拠（2026-08-08 の手動1回・run 31265047095 で実測）:
#   - 所要 **job wall 2分54秒**（バッチ本体 1分55秒）。GHA の他バッチ（nightly-scores 33分・
#     macro-beta-inference 最大340分）に比べ桁で軽く、月次で回しても Actions 時間・Supabase
#     Egress（load_data 1回分 ≈ 68MB／月・無料枠 5GB/月）とも無視できる。
#   - 有効期間数 37（2026-07-05 のローカル手動実行）→ **61**（#411 のバックフィル等でパネルが
#     伸びた分）。**手動運用のままだと「統計的最適化」プリセットが 37期で止まった重みを
#     使い続ける**＝#438 型の静かな劣化。cron 化はこれを断つのが目的。
#   - 8因子の符号は 37期版と全て一致し、有意なのは z_revenue（t=+3.18→+4.87）のみ。
#     月次更新で重みが乱高下しないことも同時に確認した。
#
# cron 時刻の選定（#476 で 12:00 → 22:00 へ変更）:
#   - 日付: 毎月1日は macro-beta-inference（UTC 00:00〜最大 05:40Z）と
#     tune-hyperparameters（UTC 16:30〜最大 22:25Z）で埋まっているため**5日**へ置く。
#     月末から5日空けるのは、最終月末スナップショットの週次バーが daily-incremental で
#     入り切るまでの余裕（1〜2日 daily が落ちても間に合う）。
#   - 時刻: daily-incremental が UTC 18:00 → 08:17 へ移り（#476）、その最悪ケース
#     （timeout-minutes: 360 ＝ 14:17Z ＋ nightly-scores 70分 ＝ 15:27Z）が旧設定の
#     12:00 を飲み込むようになった。所要20分なので 22:00 なら週次 VACUUM（土 23:30Z）にも触れない。
# **cron の名目時刻ではなくキュー遅延込みの実起動時刻で見ること**（#446 の教訓）。
# 全ワークフローの占有表は docs/DEPLOYMENT.md「cron 占有表」を参照（時刻を動かす前に必ず見る）。
#
# 依存: numpy / pandas / scipy / statsmodels（Newey-West HAC 標準誤差）はすべて requirements.txt
# に含まれるため、macro-beta-inference.yml のような専用 requirements（PyMC）は不要。
#
# 品質面: このバッチには MCMC の r_hat のような収束ゲートは無い（断面 OLS は決定的）。
# ただし有効期間数が少ないと Newey-West 補正が無意味になるため min-companies-per-period で
# 各月の最小社数を担保する（recommend_factor_premia.py の docstring 参照）。

on:
  schedule:
    - cron: '0 22 5 * *'   # UTC 22:00 = JST 翌07:00、毎月5日（→22:20Z）
  workflow_dispatch:
    inputs:
      min_companies_per_period:
        description: "この社数未満の月は断面OLSから除外する（既定30）"
        required: false
        default: "30"
      maxlags:
        description: "Newey-West補正のラグ数（既定11＝52週先リターンのオーバーラップ月数-1）"
        required: false
        default: "11"

# 最小権限（GITHUB_TOKEN でリポジトリ書込は不要・永続化は Supabase 直結）
permissions:
  contents: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    # 実測 job wall 2分54秒（2026-08-08・run 31265047095）に対し約7倍。起票時の 120 は
    # 未計測の当て推量で、ハングしても2時間気づけなかった。締めすぎると平常運転の揺らぎが
    # notify-failure の誤起票になる（#453）ため、pip install の変動と銘柄数増を吸える 20 分。
    # 所要は銘柄数・期間数とともに伸びるので、実走ログで追って必要なら上げること（#446）。
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'  # render.yaml の PYTHON_VERSION と一致させる
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Fama-MacBeth factor premia batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail   # tee で python の非ゼロ終了がマスクされ失敗が緑表示になるのを防ぐ（Issue #352）
          python recommend_factor_premia.py \
            --min-companies-per-period "${{ github.event.inputs.min_companies_per_period || '30' }}" \
            --maxlags "${{ github.event.inputs.maxlags || '11' }}" \
            --persist \
            2>&1 | tee recommend_factor_premia.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommend-factor-premia-log
          path: recommend_factor_premia.log
          retention-days: 30
