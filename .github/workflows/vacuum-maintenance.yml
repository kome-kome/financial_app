name: "[定常] DBメンテナンス（VACUUM FULL・週次）"

# JST 日曜 07:00 = UTC 土曜 22:00
#
# stock_price_daily は日次収集のたびに DELETE ベースの trim を行い、
# btree インデックスが bloat し続ける（Issue #290）。VACUUM FULL で
# 定期的に物理サイズを頭打ちにする。
#
# ⏰ 時間帯の設計根拠（Issue #427）: 旧設定 `0 19 * * 6`（JST 日曜 04:00）は
# 「daily-incremental（JST 03:00 開始）とずらす」意図だったが、差分収集の実測所要は
# 2h05m〜2h38m で **VACUUM が収集の Phase 3/4 の最中に走っていた**。
# `VACUUM FULL` は ACCESS EXCLUSIVE ロックを取るため、同時刻の株価 upsert と
# ロック競合しうる（#269 / #411 で「ロック待ちキューに後続の参照も並ぶ」実障害あり）。
# 現行の夜間チェーンは JST 03:00 収集開始 → 最長 05:40 完了 → nightly-scores 約16分
# → 06:00 頃に全完了。その後の 07:00 へ移動した。収集の所要が延びたらここも見直す。
#
# ✅ 段階導入完了（2026-07-12）: workflow_dispatch でローカル・GitHub Actions
# （Azure IP）双方から Supabase pooler 経由の VACUUM FULL 正常完了を確認済み
# （所要 8〜9秒・対象は stock_price_daily のみ・データ変更なし）。定時自動実行を有効化。

on:
  schedule:
    - cron: '0 22 * * 6'   # UTC 22:00 (土) = JST 07:00 (日)
  workflow_dispatch:

# 最小権限（GITHUB_TOKEN でリポジトリ書込は不要・収集/保守は Supabase 直結）
permissions:
  contents: read

jobs:
  vacuum:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'  # render.yaml の PYTHON_VERSION と一致させる
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run VACUUM FULL maintenance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python _pipeline_vacuum.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacuum-log
          path: logs/pipeline_vacuum.log
          retention-days: 30
