name: "[手動] DBメンテナンス（VACUUM FULL・Supabase 断面用）"

# ⛔ **定時実行は停止中**（2026-08-25・#290 / #505）。停止理由・代替経路・復旧条件は下の
#    `on:` ブロックに書いてある。以下の設計経緯は Supabase が正本だった時代のもので、
#    **復旧するときに読む記録**として残してある（時刻設計の失敗が2回あるので消さない）。
#
# JST 日曜 08:30 = UTC 土曜 23:30
#
# stock_price_daily は日次収集のたびに DELETE ベースの trim を行い、
# btree インデックスが bloat し続ける（Issue #290）。VACUUM FULL で
# 定期的に物理サイズを頭打ちにする。
#
# ⏰ 時間帯の設計根拠（Issue #427）: 旧設定 `0 19 * * 6`（JST 日曜 04:00）は
# 「daily-incremental（JST 03:00 開始）とずらす」意図だったが、差分収集の実測所要は
# 2h05m〜2h38m で **VACUUM が収集の Phase 3/4 の最中に走っていた**。
# `VACUUM FULL` は ACCESS EXCLUSIVE ロックを取るため、同時刻の株価 upsert と
# ロック競合しうる（#269 / #411 で「ロック待ちキューに後続の参照も並ぶ」実障害あり）。
# 現行の夜間チェーンは JST 03:00 収集開始 → 最長 05:40 完了 → nightly-scores 約16分
# → 06:00 頃に全完了。その後の 07:00 へ移動した。収集の所要が延びたらここも見直す。
#
# ⏰ 再調整（Issue #446・2026-08-06）: `0 22 * * 6`（JST 日曜 07:00）は**実測では重なって
# いた**。cron の JST 03:00 は名目で、GitHub のキュー遅延により daily-incremental の実起動は
# 19:45Z 前後（実測4本）。所要 2h05m〜2h38m で 21:51〜22:03Z 終了 → チェーンの nightly-scores
# （33分・#446 実測）が 22:24〜22:37Z まで走るため、日曜だけ VACUUM と約24分重なる。
# ロック対象（stock_price_daily）と夜間バッチの読み先（stock_price_weekly / financial_metrics）
# が違うので実害は出ていないが、ACCESS EXCLUSIVE を取る処理を重ねたままにしない。
# **cron の名目時刻ではなくキュー遅延込みの実起動時刻で設計すること。**
# 23:30Z = チェーン終端（最遅 22:37Z 実測）の 53分後。
#
# ⏰ 現況（Issue #476・2026-08-09）: daily-incremental が **UTC 08:17（JST 17:17）** へ
# 前倒しされ、チェーン終端は 12時台（最悪でも 15時台）になった。**上の 22:37Z 前提は
# もう成り立たず、23:30Z との間隔は大きく開いている**＝この時刻を狭める理由は無いので
# 据え置く（動かす必然が無いものを動かさない）。同じ日に走りうるのは毎月1日の
# tune-hyperparameters（16:30〜22:25Z）で、これも 23:30Z の手前で終わる。
# 全ワークフローの占有表は docs/DEPLOYMENT.md「cron 占有表」を参照。
#
# ✅ 段階導入完了（2026-07-12）: workflow_dispatch でローカル・GitHub Actions
# （Azure IP）双方から Supabase pooler 経由の VACUUM FULL 正常完了を確認済み
# （対象は stock_price_daily のみ・データ変更なし）。定時自動実行を有効化。
#
# ⏱ 所要は伸びている（Issue #471）: 43〜92MB で 7.6〜10.4秒（2026-07-18〜08-01）→
# 79MB で **37.4秒**（2026-08-09 手動実行）。2026-08-08 の定時実行は Supabase 既定の
# statement_timeout=2min にきっかり 2分01秒で殺されて失敗した。_pipeline_vacuum.py 側で
# statement_timeout を外した（ADR-0032）ため、**時間の歯止めは下の timeout-minutes だけ**に
# なっている。所要が数分規模へ伸びたらこの値を見直すこと。
# ロック待ちは lock_timeout=90s ＋ 120秒あけて最大3回の再試行で吸収する（最悪 約8分）。

on:
  # ⛔ 2026-08-25: schedule を停止（#290 / #505・ADR-0038）。**正本がローカル PostgreSQL へ移り、
  #    Supabase は 2026-08-07 の断面で凍結された**ので、こちらへ書き込む経路そのものが無い＝
  #    DELETE ベース trim も走らず bloat も増えない。凍結した断面へ毎週 `VACUUM FULL` を
  #    打ち続けても、初回以降は何も回収しない実行を繰り返すだけになる。
  #    **代替経路**: ローカル月次バッチ `run_monthly.ps1`（タスクスケジューラ・毎月1日 JST 01:00・
  #    #504）の先頭ステップ `vacuum` が、同じ `_pipeline_vacuum.py` を**正本に対して**回す
  #    （2026-08-25 のローカル実測: daily 59→49MB / weekly 188→165MB / DB 840→807MB・計 13.4秒）。
  #    **復旧条件**: 正本を Supabase へ戻す決定をしたとき、または断面へ書き戻す経路を作ったとき
  #    （#503 は「作らない」と決めている）。
  #    **手動で断面を保守したいときは** step env へ `FINAPP_DB_TARGET: prod` を一時的に足すこと。
  #    既定 local のまま起動すると localhost を見て落ちる——これは事故防止の安全弁であって
  #    バグではない（`tests/test_db_target.py` が「dispatch 専用に prod を書かない」を強制する）。
  # schedule:
  #   - cron: '30 23 * * 6'   # UTC 23:30 (土) = JST 08:30 (日)
  workflow_dispatch:

# 最小権限（GITHUB_TOKEN でリポジトリ書込は不要・収集/保守は Supabase 直結）
permissions:
  contents: read

jobs:
  vacuum:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'  # render.yaml の PYTHON_VERSION と一致させる
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run VACUUM FULL maintenance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # **FINAPP_DB_TARGET は書かない**（#290 / #505・2026-08-25）。schedule を止めた手動専用
          # なので、既定 local が「誤って起動しても localhost で落ちる」安全弁になる（#503）。
          # 断面を手で保守するときだけ `FINAPP_DB_TARGET: prod` を一時的に足す——常設すると
          # 安全弁を自分で外すことになる（`tests/test_db_target.py` が常設を禁じている）。
          FINAPP_JOB: vacuum-maintenance          # Egress 台帳の帰属ラベル（#478）
        run: python _pipeline_vacuum.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vacuum-log
          path: |
            logs/pipeline_vacuum.log
            .egress/*.jsonl
          retention-days: 30
