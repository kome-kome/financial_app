# ruff の設定（#724）。CI（.github/workflows/ci.yml）とローカルで同じ判定にするため、
# 引数ではなくここに置く。範囲は F 系（pyflakes 相当＝未定義名 F821・再定義 F811・
# 辞書キーの重複 F601 など）だけ。format・型・その他のルールは差分量に見合わないので入れない。
# 縛りは tests/test_ci_lint.py が持つ（select を狭める・CI のステップを消すと落ちる）。

target-version = "py313"   # render.yaml の PYTHON_VERSION と揃える

[lint]
select = ["F"]

# 未使用 import。導入時点（2026-10-07）で 143件あり、機械的に消すとほかのモジュールや
# テストがそこ経由で import している名前（再エクスポート）まで消える。実害は無い
# （import 漏れ＝未定義名は F821 が別に拾う）ので外し、後片付けは #825 で行う。
ignore = ["F401"]

[lint.per-file-ignores]
# collector.py は後方互換の再エクスポート層なので、分割モジュールのスター import を意図して
# 残す（#824 で決定。外から `collector.<名前>` で参照する呼び出し側を壊さないため）。
# スター import のあるファイルでは未定義名も F405 になり F821 が効かない＝この1本だけは
# 死角が残る。新しい処理は collector.py ではなく分割モジュール（collector_*.py）へ置くこと。
# 分割モジュール3本は #824 で明示 import へ置き換え、除外を外した。
"collector.py" = ["F403", "F405"]
